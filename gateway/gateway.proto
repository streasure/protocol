syntax = "proto3";

package gateway;

option go_package = "github.com/streasure/protocol/gateway";

// MessageFrame is the common client wire envelope. The body is the
// serialized business protobuf selected by cmd.
message MessageFrame {
    int32 cmd    = 1;
    int64 seq_id = 2;
    bytes body   = 99;
}

// ---- Login ----

message LoginReq {
    string user_id      = 1;
    string login_key    = 2;
    int32  server_index = 3;
    int32  channel      = 4;
    string client_ip    = 5;
    bool   is_reconnect = 6;
    string device_id    = 7;
}

message LoginAck {
    int32  code         = 1;
    string message      = 2;
    int64  server_time  = 3;
    string user_key     = 4;
}

// ---- Heartbeat ----

message HeartbeatReq {
    int64 client_time = 1;
}

message HeartbeatAck {
    int64 server_time = 1;
    int64 rtt_ms      = 2;
}

// ---- Gateway <-> Logic streaming ----

service GatewayStream {
    rpc onData(stream StreamData) returns (stream StreamData);
}

message StreamData {
    string session_id = 1;
    string user_key   = 2;
    int32  cmd        = 3;
    int64  seq_id     = 4;
    bytes  data       = 5;
    string client_ip  = 6;
    string route      = 7;
    int64  timestamp  = 8;
    map<string, string> payload      = 9;
    string checksum           = 10;
    string protocol_version   = 11;
}
