syntax = "proto3";

package gateway;

option go_package = "github.com/streasure/protocol/gateway";

// MessageFrame is the common client wire envelope. The body is the
// serialized business protobuf selected by cmd.
message MessageFrame {
    int32 cmd    = 1;
    int64 seq_id = 2;
    bytes body   = 99;
}

// ---- Gateway <-> Logic streaming ----

service GatewayStream {
    rpc onData(stream StreamData) returns (stream StreamData);
}

message StreamData {
    string session_id = 1;
    string user_key   = 2;
    int32  cmd        = 3;
    int64  seq_id     = 4;
    bytes  data       = 5;
    string client_ip  = 6;
    string route      = 7;
    int64  timestamp  = 8;
    map<string, string> payload      = 9;
    string checksum           = 10;
    string protocol_version   = 11;
}
