syntax = "proto3";

package enums;

option go_package = "github.com/streasure/protocol/enums";

enum PushType {
    PUSH_TYPE_UNSPECIFIED = 0;
    PUSH_TYPE_NOTIFY = 1;
    PUSH_TYPE_ANNOUNCEMENT = 2;
    PUSH_TYPE_CHAT = 3;
    PUSH_TYPE_KICK = 4;
}

enum CompressionType {
    COMPRESSION_TYPE_NONE = 0;
    COMPRESSION_TYPE_GZIP = 1;
    COMPRESSION_TYPE_ZSTD = 2;
    COMPRESSION_TYPE_LZ4 = 3;
}
