syntax = "proto3";

package enums;

option go_package = "github.com/streasure/protocol/enums";

enum Cmd {
    CMD_UNSPECIFIED = 0;

    // commonstruct messages (1 - 999,999)
    CMD_USER_INFO = 1;
    CMD_MESSAGE = 2;
    CMD_ERROR_RESPONSE = 3;
    CMD_ERROR_DATA = 4;
    CMD_CONNECTION_INFO = 5;
    CMD_BROADCAST_DATA = 6;
    CMD_GROUP_INFO = 7;
    CMD_GROUP_REQUEST = 8;
    CMD_GROUP_RESPONSE = 9;
    CMD_ACKNOWLEDGEMENT = 10;
    CMD_HANDSHAKE = 11;
    CMD_FLOW_CONTROL = 12;
    CMD_SERVICE_INFO = 13;
    CMD_STREAM_DATA = 14;

    // logic messages (1,000,000 - 1,999,999)
    CMD_LOGIN_REQ = 1000001;
    CMD_LOGIN_ACK = 1000002;
    CMD_LOGOUT_REQ = 1000003;
    CMD_LOGOUT_ACK = 1000004;
    CMD_BAN_INFO = 1000005;
    CMD_PUSH_NOTIFY = 1000006;
    CMD_ANNOUNCEMENT = 1000007;
    CMD_CHAT_MSG = 1000008;
    CMD_KICK_NOTIFY = 1000009;

    // sgate messages (2,000,000 - 2,999,999)
    // GatewayService gRPC - skipped per requirement
}
