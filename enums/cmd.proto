syntax = "proto3";

package enums;

option go_package = "github.com/streasure/protocol/enums";

enum Cmd {
    CMD_UNSPECIFIED = 0;

    // Gateway control messages (1,000,000 - 1,099,999)
    CMD_LOGIN_GATE_REQ = 1000001;
    CMD_LOGIN_GATE_ACK = 1000002;

    // Logic business messages (1,100,000 - 1,199,999)
    CMD_LOGIN_REQ = 1100001;
    CMD_LOGIN_ACK = 1100002;
    CMD_LOGOUT_REQ = 1100003;
    CMD_LOGOUT_ACK = 1100004;
    CMD_BAN_INFO = 1100005;
    CMD_PUSH_NOTIFY = 1100006;
    CMD_ANNOUNCEMENT = 1100007;
    CMD_CHAT_MSG = 1100008;
    CMD_KICK_NOTIFY = 1100009;
    CMD_HEARTBEAT_REQ = 1100010;
    CMD_HEARTBEAT_ACK = 1100011;
    CMD_USER_OFFLINE_NTF = 1100012;
}
