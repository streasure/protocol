syntax = "proto3";

package commonstruct;

option go_package = "github.com/streasure/protocol/commonstruct";

message ErrorResponse {
    string    route            = 1;
    int32     cmd              = 2;
    ErrorData error            = 3;
    int64     timestamp        = 4;
    string    checksum         = 5;
    string    protocol_version = 6;
}

message ErrorData {
    string message = 1;
    string code    = 2;
    string details = 3;
}

message Acknowledgement {
    int64  sequence         = 1;
    string status           = 2;
    string error            = 3;
    int64  received_at      = 4;
    int64  timestamp        = 5;
    string checksum         = 6;
    string protocol_version = 7;
}

message Handshake {
    string          protocol_version   = 1;
    repeated string supported_versions = 2;
    string          client_type        = 3;
    string          client_version     = 4;
    string          device_id          = 5;
    int64           timestamp          = 6;
    string          checksum           = 7;
}
