syntax = "proto3";

package commonstruct;

option go_package = "github.com/streasure/protocol/commonstruct";

message Message {
    string              connection_id    = 1;
    string              user_uuid        = 2;
    string              route            = 3;
    int32               cmd              = 4;
    bytes               data             = 5;
    int64               timestamp        = 6;
    string              checksum         = 7;
    bytes               signature        = 8;
    int64               sequence         = 9;
    bool                require_ack      = 10;
    int32               compression      = 11;
    int32               original_size    = 12;
    int32               compressed_size  = 13;
    string              protocol_version = 14;
    map<string, string> payload          = 15;
}

message ErrorResponse {
    string    route            = 1;
    int32     cmd              = 2;
    ErrorData error            = 3;
    int64     timestamp        = 4;
    string    checksum         = 5;
    string    protocol_version = 6;
}

message ErrorData {
    string message = 1;
    string code    = 2;
    string details = 3;
}

message Acknowledgement {
    int64  sequence         = 1;
    string status           = 2;
    string error            = 3;
    int64  received_at      = 4;
    int64  timestamp        = 5;
    string checksum         = 6;
    string protocol_version = 7;
}

message Handshake {
    string          protocol_version   = 1;
    repeated string supported_versions = 2;
    string          client_type        = 3;
    string          client_version     = 4;
    string          device_id          = 5;
    int64           timestamp          = 6;
    string          checksum           = 7;
}
