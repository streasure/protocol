syntax = "proto3";

package logic;

option go_package = "github.com/streasure/protocol/logic";

import "commonstruct/user.proto";

// LoginGateReq is handled by sgate only. It selects and binds the target logic
// server before any business request is forwarded.
message LoginGateReq {
    string server_id = 1;
    string user_id = 2;
    string login_key = 3;
    string zone = 4;
}

message LoginGateAck {
    int32 code = 1;
    string message = 2;
    string session_id = 3;
    string server_id = 4;
}

message LoginReq {
    string userId       = 1;
    string loginKey     = 2;
    int32  serverIndex  = 3;
    int32  channel      = 4;
    string clientIp     = 5;
    bool   isReconnect  = 6;
    string deviceNumber = 7;
    int32  extraFlag    = 8;
    int32  areaId       = 9;
    string packageId    = 10;
}

message LoginAck {
    commonstruct.UserInfo user           = 1;
    int64          serverTime     = 2;
    string         version        = 3;
    int64          openServerTime = 4;
    int32          serverStage    = 5;
    BanInfo        banInfo        = 6;
    int64          offlineTime    = 7;
    repeated int32 funcDisabled   = 8;
    string user_key               = 9;
}

message LogoutReq {
    string userId       = 1;
    int32  areaId       = 2;
}

message LogoutAck {
    string userId       = 1;
    int32  code         = 2;
    string message      = 3;
}

message BanInfo {
    bool   isBanned     = 1;
    int64  banEndTime   = 2;
    string banReason    = 3;
}

// ---- Heartbeat ----

message HeartbeatReq {
    int64 client_time = 1;
}

message HeartbeatAck {
    int64 server_time = 1;
    int64 rtt_ms      = 2;
}

// UserOfflineNtf is sent by sgate to the bound logic server when a client
// connection closes without a business logout request.
message UserOfflineNtf {
    string session_id = 1;
    string user_key = 2;
    string server_id = 3;
    int64 offline_time = 4;
}
